<style>
/* Layout: faixa amarela em movimento, título grande centralizado, grade de 2 colunas no celular e 4 no desktop, cartões escuros com foto, preço e botão de WhatsApp. */
:root {
  --bg: #0c0b09;
  --surface: #151412;
  --stage: #1d1b18;
  --line: #2b2926;
  --fg: #f4f1ea;
  --muted: #a3a097;
  --accent: #ffd21f;
  --ink: #0c0b09;
  --font-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: 104px;
}

.wrap {
  max-width: 1120px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

/* Faixa em movimento */
.ticker {
  background: var(--accent);
  color: var(--ink);
  overflow: hidden;
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 9px 0;
}
.ticker-track { display: flex; width: max-content; animation: correr 32s linear infinite; }
.ticker-group { display: flex; flex: none; }
.ticker-group span { padding-right: 28px; }
@keyframes correr { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

/* Abertura */
.hero { text-align: center; padding-block: 44px 38px; }
.logo {
  display: block; width: clamp(112px, 32vw, 168px); height: auto; aspect-ratio: 1 / 1; max-width: 100%;
  margin: 0 auto 22px; border-radius: 50%; object-fit: cover;
}
.eyebrow {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 0 0 18px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase;
  color: var(--muted);
}
.eyebrow::before, .eyebrow::after {
  content: ""; height: 1px; width: clamp(28px, 12vw, 80px); background: var(--line);
}
h1 {
  margin: 0;
  font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
  font-size: clamp(52px, 15vw, 128px); line-height: 0.92; letter-spacing: 0.01em;
}
h1 .super { display: block; color: var(--accent); }
h1 .black { display: block; }

.preco {
  margin-top: 28px; padding: 14px 40px;
  display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
  border-block: 1px solid var(--line);
}
.tudo { font-size: 13px; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; }
.valor {
  display: flex; align-items: flex-start; gap: 6px;
  font-family: var(--font-display); font-size: clamp(76px, 22vw, 150px); line-height: 1;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.valor small { font-size: 0.34em; line-height: 1.1; margin-top: 0.14em; }
.lead { max-width: 34ch; margin: 22px auto 0; color: var(--muted); font-size: 16px; text-wrap: balance; }

/* Grade */
.topo-grade {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
}
.topo-grade h2 {
  margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
}
.topo-grade p { margin: 0; font-size: 13px; color: var(--muted); }

.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }

.card {
  min-width: 0; padding: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  display: flex; flex-direction: column;
}
.foto {
  aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; overflow: hidden;
  background: radial-gradient(circle at 50% 38%, #2d2a25 0%, var(--stage) 55%, #121110 100%);
  display: grid; place-items: center;
}
.foto svg { width: 78%; height: 78%; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }

.info { padding: 12px 6px 6px; display: grid; gap: 10px; margin-top: auto; }
.nome {
  margin: 0; min-height: 2.7em;
  font-size: 12px; font-weight: 600; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
}
.valor-card { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }

.comprar, .zap {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--ink); text-decoration: none;
  font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
}
.comprar { padding: 12px 10px; border-radius: 12px; font-size: 13px; }
.comprar:hover, .zap:hover { filter: brightness(1.08); }
.comprar svg, .zap svg { width: 18px; height: 18px; flex: none; }

.zap {
  position: fixed; z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding: 13px 20px; border-radius: 999px; font-size: 13px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
}
</style>
